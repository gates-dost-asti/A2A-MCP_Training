project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "solutions/*.qmd"
    - "Workshop Materials/**/*.ipynb"
  resources:
    - "Presentations/*.pdf"
    - "Program - A2A & MCP Training.pdf"
    - "!**/*.ovpn"
    - "!**/.DS_Store"

# Never execute notebooks during render; use their saved outputs.
# The exercise notebooks call a gateway behind the training VPN,
# so executing them at build time would fail anyway.
execute:
  enabled: false

website:
  title: "A2A & MCP Training"
  description: "Agentic AI, Model Context Protocol, and Agent-to-Agent Protocol training materials"
  favicon: images/favicon.png
  navbar:
    logo: images/logo-horizontal.png
    logo-alt: "GATES Program logo"
    logo-href: index.qmd
    left:
      - href: index.qmd
        text: Home
      - href: setup.qmd
        text: Setup
      - href: agentic-ai.qmd
        text: Agentic AI
      - href: mcp.qmd
        text: MCP
      - href: a2a.qmd
        text: A2A
      - href: solutions/index.qmd
        text: Solutions
      - href: presentations.qmd
        text: Presentations
    right:
      - icon: github
        href: https://github.com/gates-dost-asti/A2A-MCP_Training
        aria-label: GitHub
  page-footer:
    center: "A2A & MCP Training · GATES Data Lakehouse Component"
    border: false

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    code-copy: true
    code-overflow: wrap
